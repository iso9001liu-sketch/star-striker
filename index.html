<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04060d">
<title>星际战机 · 打飞机小游戏</title>
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect width="32" height="32" rx="6" fill="%2304060d"/><path d="M16 5 L20.5 20 L16 26 L11.5 20 Z" fill="%234de8ff"/><path d="M11.5 20 8.5 25 M20.5 20 23.5 25" stroke="%23ff6b8a" stroke-width="2" stroke-linecap="round"/></svg>'>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#04060d;touch-action:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
body{font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,-apple-system,"Segoe UI",sans-serif;color:#eaf6ff;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
#game{position:fixed;inset:0;display:block;cursor:crosshair}

#hud{position:fixed;top:0;left:0;right:0;padding:calc(8px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) 0 calc(12px + env(safe-area-inset-left));display:grid;grid-template-columns:1fr auto 1fr;align-items:start;pointer-events:none;z-index:5}
.hud-col{display:flex;flex-direction:column;gap:5px}
#hudLeft{justify-self:start}
#hudCenter{justify-self:center;text-align:center}
#hudRight{justify-self:end;align-items:flex-end;gap:6px}
#scoreLabel{font-size:clamp(9px,2.4vw,12px);letter-spacing:3px;color:#7fd8ff;opacity:.85}
#scoreVal{font-size:clamp(18px,4.5vw,26px);font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:1px;color:#fff;text-shadow:0 0 12px rgba(77,232,255,.85)}
#combo{display:none;font-size:clamp(13px,3.4vw,16px);font-weight:800;color:#ffd24d;text-shadow:0 0 10px rgba(255,210,77,.9)}
#levelName{font-size:clamp(9px,2.6vw,12px);letter-spacing:2px;color:#9fd8ff;text-shadow:0 1px 4px rgba(0,0,0,.6)}
#progressWrap{width:clamp(88px,26vw,150px);height:5px;background:rgba(255,255,255,.14);border-radius:3px;margin:5px auto 0;overflow:hidden}
#progressFill{height:100%;width:0%;background:linear-gradient(90deg,#4de8ff,#7fff9e);border-radius:3px;transition:width .18s ease}
#muteBtn{pointer-events:auto;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.22);color:#bfe9ff;display:flex;align-items:center;justify-content:center;cursor:pointer;margin-bottom:2px}
#muteBtn:focus-visible{outline:2px solid #4de8ff;outline-offset:2px}
.statRow{display:flex;align-items:center;gap:3px;min-height:22px}
.statRow svg{flex:none}
.statRow .xMore{font-size:14px;font-weight:800;color:#7fd8ff;opacity:.95;letter-spacing:0;padding-left:3px}
.statRow .xMoreBomb{color:#ff8fb0}

#bombBtn{position:fixed;right:calc(16px + env(safe-area-inset-right));bottom:calc(22px + env(safe-area-inset-bottom));width:clamp(56px,15vw,68px);height:clamp(56px,15vw,68px);border-radius:50%;background:rgba(255,77,141,.15);border:1.5px solid rgba(255,107,138,.7);color:#ff8fb0;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;z-index:10;-webkit-tap-highlight-color:transparent;pointer-events:auto}
#bombBtn .cnt{font-size:15px;font-weight:800;line-height:1;margin-top:3px}
#bombBtn.empty{opacity:.38}
#bombBtn:active{transform:scale(.94)}
#bombBtn:focus-visible{outline:2px solid #ff6b8a;outline-offset:2px}

.overlay{position:fixed;inset:0;height:100vh;height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:radial-gradient(ellipse at 50% 42%,rgba(9,18,42,.78),rgba(3,5,12,.94));z-index:15;text-align:center;padding:24px}
.hidden{display:none!important}
.title{font-size:clamp(42px,10vw,74px);font-weight:900;letter-spacing:8px;color:#fff;text-shadow:0 0 20px rgba(77,232,255,.95),0 0 70px rgba(77,232,255,.45);line-height:1.1}
.subtitle{color:#8fd8ff;letter-spacing:5px;font-size:14px;margin-top:-6px}
.best{color:#ffd24d;font-size:16px;font-weight:700;text-shadow:0 0 10px rgba(255,210,77,.5)}
.hint{font-size:14px;color:#8fb4d4;line-height:2.1}
.btn{pointer-events:auto;cursor:pointer;border:1px solid rgba(77,232,255,.85);background:rgba(77,232,255,.12);color:#dffbff;font-size:18px;font-weight:700;letter-spacing:6px;padding:14px 46px;border-radius:40px;transition:background .18s,box-shadow .18s,transform .1s;-webkit-tap-highlight-color:transparent}
.btn:hover{background:rgba(77,232,255,.3);box-shadow:0 0 26px rgba(77,232,255,.55)}
.btn:active{transform:scale(.97)}
.btn.ghost{border-color:rgba(255,255,255,.3);background:rgba(255,255,255,.06);color:#cfe6f5;font-size:15px;letter-spacing:4px;padding:11px 34px}
.pauseTitle{font-size:34px;font-weight:800;letter-spacing:8px;color:#fff;text-shadow:0 0 18px rgba(77,232,255,.8)}
#finalScore{font-size:22px;color:#eaf6ff}
.kbd{display:inline-block;padding:1px 7px;border:1px solid rgba(160,215,255,.4);border-radius:5px;background:rgba(160,215,255,.08);font-size:12px;margin:0 2px}
.hintMobile{display:none}

#banner{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:12}
#banner .txt{font-size:clamp(30px,7vw,54px);font-weight:900;letter-spacing:10px;color:#fff;text-shadow:0 0 22px rgba(77,232,255,.95),0 0 80px rgba(77,232,255,.4);opacity:0}
#banner.show .txt{animation:bannerIn 1.5s ease both}
@keyframes bannerIn{0%{opacity:0;transform:scale(.82)}14%{opacity:1;transform:scale(1.05)}30%{opacity:1;transform:scale(1)}78%{opacity:1}100%{opacity:0;transform:translateY(-12px) scale(1.02)}}

@media (max-width:768px){
  .hintDesktop{display:none}
  .hintMobile{display:inline}
}
@media (max-width:640px){
  .title{letter-spacing:5px}
}
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="hud">
  <div class="hud-col" id="hudLeft">
    <div id="scoreLabel">SCORE</div>
    <div id="scoreVal">0</div>
    <div id="combo"></div>
  </div>
  <div class="hud-col" id="hudCenter">
    <div id="levelName">LEVEL 1</div>
    <div id="progressWrap"><div id="progressFill"></div></div>
  </div>
  <div class="hud-col" id="hudRight">
    <button id="muteBtn" role="switch" aria-checked="true" aria-label="音效开关"></button>
    <div class="statRow" id="livesRow"></div>
    <div class="statRow" id="bombsRow"></div>
  </div>
</div>

<button id="bombBtn" class="hidden" aria-label="释放炸弹">
  <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="6.5"/><path d="M12 2v3" stroke-linecap="round"/></svg>
  <span class="cnt">0</span>
</button>

<div id="banner"><div class="txt"></div></div>

<div class="overlay" id="menuOverlay">
  <div class="title">星际战机</div>
  <div class="subtitle">STAR STRIKER · 打飞机小游戏</div>
  <div class="best" id="menuBest">最高分 0</div>
  <div class="hint">
    <span class="hintDesktop">移动鼠标控制战机，自动开火 · <span class="kbd">空格</span>/<span class="kbd">B</span>/<span class="kbd">Shift</span> 放炸弹 · <span class="kbd">Esc</span> 暂停</span>
    <span class="hintMobile">拖动手指控制战机，自动开火 · 点右下角按钮放炸弹</span>
  </div>
  <button class="btn" id="startBtn">开始游戏</button>
</div>

<div class="overlay hidden" id="pauseOverlay">
  <div class="pauseTitle">已暂停</div>
  <button class="btn" id="resumeBtn">继续</button>
  <button class="btn ghost" id="restartBtn">重新开始</button>
</div>

<div class="overlay hidden" id="overOverlay">
  <div class="title" style="font-size:clamp(36px,9vw,60px);color:#ff8fb0;letter-spacing:4px;">游戏结束</div>
  <div id="finalScore">本局得分 0</div>
  <div class="best" id="overBest">最高分 0</div>
  <button class="btn" id="againBtn">再来一局</button>
</div>

<script>
'use strict';
(function(){
  // ==================== DOM ====================
  const canvas=document.getElementById('game'), ctx=canvas.getContext('2d');
  const $=id=>document.getElementById(id);
  const scoreValEl=$('scoreVal'),comboEl=$('combo'),levelNameEl=$('levelName'),
        progressFill=$('progressFill'),livesRow=$('livesRow'),bombsRow=$('bombsRow'),
        muteBtn=$('muteBtn'),bombBtn=$('bombBtn'),
        banner=$('banner'),bannerTxt=banner.querySelector('.txt'),
        menuOverlay=$('menuOverlay'),pauseOverlay=$('pauseOverlay'),overOverlay=$('overOverlay'),
        menuBest=$('menuBest'),finalScore=$('finalScore'),overBest=$('overBest');

  // ==================== 工具 ====================
  const rand=(a,b)=>a+Math.random()*(b-a);
  const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
  const TAU=Math.PI*2;
  const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ==================== 配置 ====================
  const CFG={fireInterval:0.15,bombMax:3,comboWindow:2.2};
  // 火力无上限：按等级动态生成弹道，每级都更强（主炮每2级+1条，侧翼每级每侧+1条）
  function weaponShots(w){
    // 弹道数量 8 级封顶：8 级之后不再增加弹道，只按真实等级提升单发伤害
    w=Math.min(w,8);
    const shots=[];
    const mains=1+Math.floor((w-1)/2);
    for(let i=0;i<mains;i++) shots.push({dx:(i-(mains-1)/2)*10,dy:-26,vx:0});
    const side=Math.max(0,w-1);
    for(let i=0;i<side;i++){
      const ang=Math.min(0.12+0.035*i,0.36);
      const vx=Math.round(Math.tan(ang)*780);
      shots.push({dx:-(6+4*i),dy:-23,vx:-vx});
      shots.push({dx:6+4*i,dy:-23,vx:vx});
    }
    return shots;
  }
  const ETYPES={
    drone:{hp:1,r:14,score:100,spd:110,color:'#ff6b8a'},
    fighter:{hp:3,r:17,score:300,spd:78,color:'#ff9d5c'},
    tank:{hp:10,r:26,score:800,spd:44,color:'#c58bff'},
    kamikaze:{hp:1,r:13,score:200,spd:230,color:'#ff4d4d'}
  };
  const PU_COL={weapon:'#4de8ff',shield:'#7fff9e',bomb:'#ff6b8a',life:'#ff8fb0',bonus:'#ffd24d'};

  // ==================== 视口 ====================
  const VW={w:0,h:0,dpr:1};
  const BASE=420;   // 参考最小边长：整个游戏世界按此比例缩放
  let S=1, GW=0, GH=0;   // S=缩放系数, GW/GH=虚拟游戏世界宽高
  let vignette=null, stars=[];

  // ==================== 状态 ====================
  let state='menu', score=0, best=+(localStorage.getItem('ps-best')||0);
  let combo=0, comboT=0, comboMul=1;
  let level=1, kills=0, quota=18, bossActive=false, boss=null, spawnT=1.0, time=0, flash=0, shakeT=0, shakeMag=0;
  let player=null;
  let bullets=[],ebullets=[],enemies=[],powerups=[],parts=[],texts=[];

  // ==================== 输入 ====================
  const keys=new Set();
  const pointer={active:false,x:0,y:0,touch:false};

  // ==================== 音频 ====================
  const AUD={
    ctx:null,master:null,noiseBuf:null,
    muted:localStorage.getItem('ps-muted')==='1',
    ensure(){
      if(!this.ctx){
        const AC=window.AudioContext||window.webkitAudioContext;
        if(!AC) return;
        this.ctx=new AC();
        this.master=this.ctx.createGain();
        this.master.gain.value=0.4;
        this.master.connect(this.ctx.destination);
      }
      if(this.ctx.state==='suspended') this.ctx.resume();
    },
    tone(o){
      if(this.muted||!this.ctx) return;
      try{
        const t=this.ctx.currentTime+(o.delay||0), d=o.dur||0.1;
        const osc=this.ctx.createOscillator(), g=this.ctx.createGain();
        osc.type=o.type||'square';
        osc.frequency.setValueAtTime(o.f0,t);
        if(o.f1) osc.frequency.exponentialRampToValueAtTime(Math.max(o.f1,1),t+d);
        const v=o.vol||0.15;
        g.gain.setValueAtTime(0.0001,t);
        g.gain.exponentialRampToValueAtTime(v,t+0.008);
        g.gain.exponentialRampToValueAtTime(0.0001,t+d);
        osc.connect(g); g.connect(this.master);
        osc.start(t); osc.stop(t+d+0.03);
      }catch(e){}
    },
    noise(dur,vol,delay){
      if(this.muted||!this.ctx) return;
      try{
        if(!this.noiseBuf){
          const len=this.ctx.sampleRate;
          this.noiseBuf=this.ctx.createBuffer(1,len,this.ctx.sampleRate);
          const d=this.noiseBuf.getChannelData(0);
          for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
        }
        const t=this.ctx.currentTime+(delay||0);
        const src=this.ctx.createBufferSource(); src.buffer=this.noiseBuf;
        const g=this.ctx.createGain();
        g.gain.setValueAtTime(vol,t);
        g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
        const f=this.ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=900;
        src.connect(f); f.connect(g); g.connect(this.master);
        src.start(t); src.stop(t+dur+0.03);
      }catch(e){}
    },
    shoot(){ this.tone({f0:900,f1:320,dur:0.05,type:'square',vol:0.03}); },
    enemyShoot(){ this.tone({f0:360,f1:240,dur:0.05,type:'triangle',vol:0.045}); },
    hit(){ this.tone({f0:240,f1:70,dur:0.1,type:'sawtooth',vol:0.08}); },
    boom(){ this.noise(0.45,0.28); this.tone({f0:130,f1:32,dur:0.42,type:'sawtooth',vol:0.18}); },
    power(){ this.tone({f0:523,f1:1046,dur:0.09,type:'triangle',vol:0.13}); this.tone({f0:784,f1:1568,dur:0.11,type:'triangle',vol:0.13,delay:0.09}); },
    bombSnd(){ this.noise(0.9,0.4); this.tone({f0:70,f1:24,dur:0.8,type:'sine',vol:0.28}); },
    hurt(){ this.tone({f0:320,f1:90,dur:0.28,type:'square',vol:0.15}); this.noise(0.3,0.14); },
    bossAlarm(){ this.tone({f0:233,f1:233,dur:0.18,type:'square',vol:0.11}); this.tone({f0:233,f1:233,dur:0.18,type:'square',vol:0.11,delay:0.22}); },
    gameover(){ [392,311,233,155].forEach((f,i)=>this.tone({f0:f,f1:f*0.9,dur:0.28,type:'triangle',vol:0.15,delay:i*0.16})); }
  };

  // ==================== 图标 ====================
  const ICON_SHIP='<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#4de8ff" stroke-width="1.6" stroke-linejoin="round"><path d="M12 3 15.5 16 12 19 8.5 16Z"/><path d="M8.5 16 6 20M15.5 16 18 20" stroke-linecap="round"/></svg>';
  const ICON_SHIP_DIM='<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="rgba(255,255,255,.22)" stroke-width="1.6" stroke-linejoin="round"><path d="M12 3 15.5 16 12 19 8.5 16Z"/><path d="M8.5 16 6 20M15.5 16 18 20" stroke-linecap="round"/></svg>';
  const ICON_BOMB='<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#ff6b8a" stroke-width="2"><circle cx="12" cy="12" r="6.5"/><path d="M12 2v3" stroke-linecap="round"/></svg>';
  const ICON_BOMB_DIM='<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="rgba(255,255,255,.22)" stroke-width="2"><circle cx="12" cy="12" r="6.5"/><path d="M12 2v3" stroke-linecap="round"/></svg>';
  const ICON_SOUND_ON='<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
  const ICON_SOUND_OFF='<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="m16 9 6 6"/><path d="m22 9-6 6"/></svg>';

  // ==================== 视口与背景 ====================
  function makeStars(){
    stars=[];
    const n=Math.round(VW.w*VW.h/5200);
    for(let i=0;i<n;i++){
      const layer=Math.random();
      stars.push({
        x:Math.random()*VW.w,y:Math.random()*VW.h,
        size:layer<0.6?1:(layer<0.9?1.6:2.4),
        speed:(30+layer*150)*(0.6+Math.random()*0.8),
        c:layer<0.6?'#7fb4d8':(layer<0.9?'#bfe9ff':'#ffffff'),
        a:0.25+layer*0.55
      });
    }
  }
  function makeVignette(){
    vignette=document.createElement('canvas');
    vignette.width=Math.round(VW.w); vignette.height=Math.round(VW.h);
    const vc=vignette.getContext('2d');
    const g=vc.createRadialGradient(VW.w/2,VW.h*0.45,VW.h*0.3,VW.w/2,VW.h*0.55,VW.h*0.9);
    g.addColorStop(0,'rgba(0,0,0,0)');
    g.addColorStop(1,'rgba(0,0,0,0.5)');
    vc.fillStyle=g; vc.fillRect(0,0,VW.w,VW.h);
  }
  function updateStars(dt){
    for(const s of stars){
      s.y+=s.speed*dt*(1+level*0.05);
      if(s.y>VW.h){ s.y=-4; s.x=Math.random()*VW.w; }
    }
  }

  // ==================== 实体 ====================
  function makePlayer(){
    return {x:GW/2,y:GH-150,r:15,lives:3,bombs:1,weapon:1,fireT:0,inv:0,shield:0,speed:520,trailT:0};
  }
  function spawnEnemy(type,x,y){
    const T=ETYPES[type];
    // 敌人随关卡变强：所有类型血量按关卡成长，速度也随关卡提升（对抗玩家无限火力）
    const lv=level;
    const hp=Math.round((T.hp+(type==='tank'?(lv-1)*2:(type==='fighter'?(lv-1):0)))*(1+(lv-1)*0.25));
    const spd=T.spd*(1+(lv-1)*0.07);
    enemies.push({type,x,y,x0:x,t:0,hp,r:T.r,ang:0,hitT:0,fireT:rand(0.8,2.6),spd});
  }
  function spawnGroup(){
    const r=Math.random();
    if(r<0.16 && level>=2 && enemies.length<16){
      const type=Math.random()<0.5?'drone':'kamikaze';
      const n=3+(Math.random()<0.35?2:0);
      const sx=rand(80,GW-80);
      for(let i=0;i<n;i++) spawnEnemy(type,sx+i*40,-20-i*30);
    } else if(r<0.3 && level>=2 && enemies.length<12){
      spawnEnemy('tank',rand(70,GW-70),-30);
    } else {
      const w=Math.random();
      let type='drone';
      if(w<0.42) type='drone';
      else if(w<0.72) type='fighter';
      else if(w<0.88) type=level>=2?'kamikaze':'drone';
      else type=level>=2?'tank':'fighter';
      spawnEnemy(type,rand(40,GW-40),-30);
    }
  }
  function spawnBoss(){
    bossActive=true;
    boss={x:GW/2,y:-150,r:74,t:0,state:'enter',fireT:2.2,hp:0,maxHP:0,hitT:0};
    boss.maxHP=70+(level-1)*45;
    boss.hp=boss.maxHP;
    AUD.bossAlarm();
  }
  function spawnPowerup(x,y){
    const r=Math.random();
    let type;
    if(r<0.40) type='weapon';
    else if(r<0.65) type='shield';
    else if(r<0.85) type='bomb';
    else if(r<0.95) type='life';
    else type='bonus';
    powerups.push({type,x,x0:x,y,t:0,life:12});
  }
  function fireEnemy(x,y,aim,spread){
    const sp=180+level*20;
    let vx,vy;
    if(aim){
      const a=Math.atan2(player.y-y,player.x-x)+spread;
      vx=Math.cos(a)*sp; vy=Math.sin(a)*sp;
    } else {
      vx=Math.sin(spread)*sp; vy=Math.cos(spread)*sp;
    }
    ebullets.push({x,y,vx,vy,r:5,t:0});
  }
  function explosion(x,y,size,color){
    const n=Math.round(8+size*1.2);
    for(let i=0;i<n;i++){
      const a=Math.random()*TAU, sp=rand(40,160+size*3);
      parts.push({kind:'spark',x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:rand(0.25,0.7),max:0.7,size:rand(2,3.5)+size*0.12,color});
    }
    parts.push({kind:'ring',x,y,maxR:size*3.2,life:0.32,max:0.32,color});
    // 击落震动手感：轻幅度、短时长，避免频繁爆炸导致画面持续剧烈晃动
    shake(Math.min(7,size*0.22));
  }
  function spawnSpark(x,y,color,n){
    for(let i=0;i<n;i++){
      const a=Math.random()*TAU, sp=rand(30,140);
      parts.push({kind:'spark',x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:rand(0.2,0.45),max:0.45,size:rand(1.5,3),color});
    }
  }
  function shake(m){
    if(RM) return;
    shakeMag=Math.max(shakeMag,m);
    shakeT=0.2;
  }

  // ==================== 游戏流程 ====================
  function killEnemy(j){
    const e=enemies[j];
    enemies.splice(j,1);
    combo=comboT>0?combo+1:1;
    comboT=CFG.comboWindow;
    comboMul=Math.min(8,1+Math.floor(combo/4));
    const base=Math.round(ETYPES[e.type].score*(1+(level-1)*0.15));
    const gain=base*comboMul;
    score+=gain;
    texts.push({x:e.x,y:e.y-12,str:'+'+gain,color:'#ffd24d',life:0.9,max:0.9,size:15,vy:-55});
    explosion(e.x,e.y,e.r,ETYPES[e.type].color);
    AUD.boom();
    kills++;
    const dc=e.type==='tank'?0.3:(e.type==='fighter'?0.12:(e.type==='kamikaze'?0.07:0.05));
    if(Math.random()<dc) spawnPowerup(e.x,e.y);
  }
  function killBoss(){
    const gain=5000*comboMul;
    score+=gain;
    texts.push({x:boss.x,y:boss.y-54,str:'+'+gain,color:'#ffd24d',life:1.4,max:1.4,size:26,vy:-40});
    explosion(boss.x,boss.y,60,'#ff8fb0');
    explosion(boss.x-50,boss.y+30,34,'#ff6b8a');
    explosion(boss.x+50,boss.y+30,34,'#ff6b8a');
    explosion(boss.x,boss.y-40,30,'#ffd24d');
    AUD.boom();
    spawnPowerup(boss.x-40,boss.y+30);
    spawnPowerup(boss.x+40,boss.y+30);
    player.lives++;
    boss=null; bossActive=false;
    levelUp();
    updateIcons();
  }
  function levelUp(){
    level++;
    kills=0;
    quota=18+(level-1)*6;
    showBanner('LEVEL '+level+' · 生命+1');
    AUD.power();
  }
  function hurtPlayer(){
    if(player.inv>0) return;
    if(player.shield>0){
      player.shield--; player.inv=2.6;
      parts.push({kind:'ring',x:player.x,y:player.y,maxR:60,life:0.35,max:0.35,color:'#7fff9e'});
      AUD.hit();
      updateIcons();
      return;
    }
    player.lives--;
    player.inv=2.6;
    explosion(player.x,player.y,26,'#4de8ff');
    AUD.hurt();
    shake(16);
    updateIcons();
    if(player.lives<=0) gameOver();
  }
  function pickup(u){
    AUD.power();
    if(u.type==='weapon'){
      player.weapon++;
      texts.push({x:u.x,y:u.y-14,str:'火力升级 · LV'+player.weapon,color:'#4de8ff',life:0.9,max:0.9,size:16,vy:-55});
    } else if(u.type==='shield'){
      player.shield++;
      texts.push({x:u.x,y:u.y-14,str:'护盾 +1 · '+player.shield+'层',color:'#7fff9e',life:0.9,max:0.9,size:16,vy:-55});
    } else if(u.type==='bomb'){
      player.bombs++;
      texts.push({x:u.x,y:u.y-14,str:'炸弹 +1 · '+player.bombs,color:'#ff6b8a',life:0.9,max:0.9,size:16,vy:-55});
    } else if(u.type==='life'){
      player.lives++;
      texts.push({x:u.x,y:u.y-14,str:'生命 +1 · '+player.lives,color:'#ff8fb0',life:0.9,max:0.9,size:16,vy:-55});
    } else {
      score+=500;
      texts.push({x:u.x,y:u.y-14,str:'+500',color:'#ffd24d',life:0.9,max:0.9,size:16,vy:-55});
    }
    updateIcons();
  }
  function useBomb(){
    if(state!=='playing'||!player||player.bombs<=0) return;
    player.bombs--;
    flash=1;
    parts.push({kind:'shock',x:player.x,y:player.y,maxR:Math.max(GW,GH)*0.9,life:0.6,max:0.6,color:'#eafcff'});
    AUD.bombSnd();
    shake(20);
    for(const b of ebullets) spawnSpark(b.x,b.y,'#ff8fb0',2);
    ebullets.length=0;
    for(let i=enemies.length-1;i>=0;i--){
      const e=enemies[i];
      explosion(e.x,e.y,e.r,ETYPES[e.type].color);
      enemies.splice(i,1);
      kills++;
      score+=ETYPES[e.type].score;
    }
    if(boss&&boss.state!=='enter'){ boss.hp-=45; if(boss.hp<=0) killBoss(); }
    updateIcons();
  }
  // ==================== 更新 ====================
  function update(dt){
    time+=dt;
    updateStars(dt);
    if(comboT>0){
      comboT-=dt;
      if(comboT<=0){ combo=0; comboMul=1; }
    }
    const p=player;
    // 移动
    let tx=p.x, ty=p.y, ax=0, ay=0;
    if(keys.has('ArrowLeft')||keys.has('KeyA')) ax-=1;
    if(keys.has('ArrowRight')||keys.has('KeyD')) ax+=1;
    if(keys.has('ArrowUp')||keys.has('KeyW')) ay-=1;
    if(keys.has('ArrowDown')||keys.has('KeyS')) ay+=1;
    if(ax||ay){
      const l=Math.hypot(ax,ay);
      tx=p.x+ax/l*p.speed*dt; ty=p.y+ay/l*p.speed*dt;
    }
    if(pointer.active){ tx=pointer.x/S; ty=pointer.y/S; }
    const k=1-Math.pow(0.0006,dt);
    p.x+=(tx-p.x)*k; p.y+=(ty-p.y)*k;
    p.x=clamp(p.x,22,GW-22); p.y=clamp(p.y,60,GH-150);   // 底部预留空间：战机不会被炸弹按钮/系统手势条遮住
    p.inv=Math.max(0,p.inv-dt);
    // 尾焰
    p.trailT-=dt;
    if(p.trailT<=0){
      p.trailT=0.03;
      parts.push({kind:'spark',x:p.x+rand(-3,3),y:p.y+22,vx:rand(-12,12),vy:rand(60,130),life:rand(0.2,0.4),max:0.4,size:rand(1.5,3),color:Math.random()<0.5?'#4de8ff':'#7fe9ff'});
    }
    // 开火
    p.fireT-=dt;
    if(p.fireT<=0){
      p.fireT=CFG.fireInterval;
      const shots=weaponShots(p.weapon);
      const dmg=1+Math.floor((p.weapon-1)/8);
      for(const s of shots) bullets.push({x:p.x+s.dx,y:p.y+s.dy,vx:s.vx,vy:-780,r:4,dmg:dmg,t:0});
      AUD.shoot();
    }
    flash=Math.max(0,flash-dt*2.4);
    shakeT=Math.max(0,shakeT-dt);
    // 生成
    if(!bossActive){
      spawnT-=dt;
      const interval=Math.max(0.34,1.35-level*0.09);
      if(spawnT<=0){ spawnT=interval; spawnGroup(); }
      if(kills>=quota) spawnBoss();
    }
    updateEnemies(dt);
    updateBoss(dt);
    updateBullets(dt);
    // 敌机撞玩家
    for(let i=enemies.length-1;i>=0;i--){
      const e=enemies[i];
      const dx=e.x-p.x, dy=e.y-p.y, rr=e.r+p.r;
      if(dx*dx+dy*dy<=rr*rr){
        enemies.splice(i,1);
        explosion(e.x,e.y,e.r,ETYPES[e.type].color);
        AUD.boom();
        hurtPlayer();
        if(state!=='playing') return;
      }
    }
    // Boss 撞玩家
    if(boss&&boss.state==='fight'){
      const dx=boss.x-p.x, dy=boss.y-p.y, rr=boss.r+p.r;
      if(dx*dx+dy*dy<=rr*rr){
        hurtPlayer();
        if(state!=='playing') return;
      }
    }
    updatePowerups(dt);
    updateParticles(dt);
    updateTexts(dt);
    // HUD 快字段
    scoreValEl.textContent=score;
    comboEl.style.display=comboMul>1?'block':'none';
    comboEl.textContent='连击 x'+comboMul;
    levelNameEl.textContent=bossActive?'BOSS 来袭':'LEVEL '+level;
    progressFill.style.width=(bossActive?100:Math.min(100,kills/quota*100))+'%';
  }
  function updateEnemies(dt){
    for(let i=enemies.length-1;i>=0;i--){
      const e=enemies[i], T=ETYPES[e.type];
      e.t+=dt;
      if(e.hitT>0) e.hitT-=dt;
      if(e.type==='drone'){ e.y+=e.spd*dt; e.x=e.x0+Math.sin(e.t*1.8)*26; }
      else if(e.type==='fighter'){ e.y+=e.spd*dt; e.x=e.x0+Math.sin(e.t*1.1)*64; }
      else if(e.type==='tank'){ e.y+=e.spd*dt; e.x=e.x0+Math.sin(e.t*0.7)*40; }
      else if(e.type==='kamikaze'){
        if(e.t<0.7){ e.y+=e.spd*dt; }
        else{
          const ang=Math.atan2(player.y-e.y,player.x-e.x);
          const sp=e.spd*(1+level*0.12);
          e.x+=Math.cos(ang)*sp*dt; e.y+=Math.sin(ang)*sp*dt;
          e.ang=ang;
        }
      }
      // 开火
      if(e.fireT>0){
        e.fireT-=dt;
        if(e.fireT<=0){
          if(e.type==='fighter'){
            fireEnemy(e.x,e.y+16,true,0);
            e.fireT=Math.max(0.9,2.2-level*0.12);
            AUD.enemyShoot();
          } else if(e.type==='tank'){
            fireEnemy(e.x,e.y+22,false,0);
            fireEnemy(e.x,e.y+22,false,0.22);
            fireEnemy(e.x,e.y+22,false,-0.22);
            e.fireT=Math.max(1.6,3.4-level*0.18);
            AUD.enemyShoot();
          }
        }
      }
      if(e.y>GH+50) enemies.splice(i,1);
    }
  }
  function updateBoss(dt){
    if(!boss) return;
    const b=boss;
    b.t+=dt;
    if(b.hitT>0) b.hitT-=dt;
    if(b.state==='enter'){
      b.y+=90*dt;
      if(b.y>=120){ b.y=120; b.state='fight'; b.swing=0; showBanner('BOSS 来袭'); }
      return;
    }
    // 用独立摆动相位（战斗开始才累计），避免入场期间累计的相位在开战瞬间产生横向跳变（瞬移）
    b.swing+=dt;
    const range=Math.min(GW*0.30,280);
    b.x=clamp(GW/2+Math.sin(b.swing*0.75)*range,90,GW-90);
    b.fireT-=dt;
    const enraged=b.hp<b.maxHP*0.5;
    const itv=enraged?0.9:1.7;
    if(b.fireT<=0){
      b.fireT=itv;
      const a=Math.atan2(player.y-b.y,player.x-b.x);
      for(const off of [-0.18,0,0.18]) fireEnemy(b.x,b.y+40,true,off);
      if(Math.random()<0.45){
        for(let i=-2;i<=2;i++) fireEnemy(b.x+Math.sin(i*1.2)*60,b.y+20,false,i*0.26);
      }
      AUD.hit();
    }
  }
  function updateBullets(dt){
    for(let i=bullets.length-1;i>=0;i--){
      const b=bullets[i];
      b.x+=b.vx*dt; b.y+=b.vy*dt; b.t+=dt;
      if(b.y<-30||b.x<-30||b.x>GW+30){ bullets.splice(i,1); continue; }
      let dead=false;
      for(let j=enemies.length-1;j>=0;j--){
        const e=enemies[j];
        const dx=b.x-e.x, dy=b.y-e.y, rr=e.r+b.r;
        if(dx*dx+dy*dy<=rr*rr){
          e.hp-=b.dmg; e.hitT=0.08;
          bullets.splice(i,1); dead=true;
          spawnSpark(b.x,b.y,'#bfe9ff',4);
          if(e.hp<=0) killEnemy(j);
          break;
        }
      }
      if(dead) continue;
      if(boss&&boss.state!=='enter'){
        const dx=b.x-boss.x, dy=b.y-boss.y, rr=boss.r+b.r;
        if(dx*dx+dy*dy<=rr*rr){
          boss.hp-=b.dmg; boss.hitT=0.08;
          bullets.splice(i,1);
          spawnSpark(b.x,b.y,'#ffd24d',4);
          if(boss.hp<=0) killBoss();
        }
      }
    }
    for(let i=ebullets.length-1;i>=0;i--){
      const b=ebullets[i];
      b.x+=b.vx*dt; b.y+=b.vy*dt; b.t+=dt;
      if(b.y>GH+30||b.y<-30||b.x<-30||b.x>GW+30){ ebullets.splice(i,1); continue; }
      if(player.inv<=0){
        const dx=b.x-player.x, dy=b.y-player.y, rr=player.r+b.r;
        if(dx*dx+dy*dy<=rr*rr){
          ebullets.splice(i,1);
          hurtPlayer();
          if(state!=='playing') return;
        }
      }
    }
  }
  function updatePowerups(dt){
    for(let i=powerups.length-1;i>=0;i--){
      const u=powerups[i];
      u.t+=dt; u.life-=dt;
      if(u.life<=0){ powerups.splice(i,1); continue; }
      u.y+=85*dt;
      u.x=u.x0+Math.sin(u.t*2)*34;
      const dx=u.x-player.x, dy=u.y-player.y, rr=player.r+22;
      if(dx*dx+dy*dy<=rr*rr){
        pickup(u);
        powerups.splice(i,1);
      }
    }
  }
  function updateParticles(dt){
    for(let i=parts.length-1;i>=0;i--){
      const p=parts[i];
      p.life-=dt;
      if(p.life<=0){ parts.splice(i,1); continue; }
      if(p.kind==='spark'){
        p.x+=p.vx*dt; p.y+=p.vy*dt;
        p.vx*=0.98; p.vy*=0.98;
      }
    }
    if(parts.length>700) parts.splice(0,parts.length-700);
  }
  function updateTexts(dt){
    for(let i=texts.length-1;i>=0;i--){
      const t=texts[i];
      t.life-=dt;
      if(t.life<=0){ texts.splice(i,1); continue; }
      t.y+=t.vy*dt;
    }
  }

  // ==================== 渲染 ====================
  function rr(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }
  function render(){
    ctx.setTransform(VW.dpr,0,0,VW.dpr,0,0);
    // 背景：先铺纯色兜底，再叠渐变（个别 WebView 不支持渐变时也有正常底色）
    ctx.fillStyle='#0a1122'; ctx.fillRect(0,0,VW.w,VW.h);
    const g=ctx.createLinearGradient(0,0,0,VW.h);
    g.addColorStop(0,'#03050c'); g.addColorStop(0.6,'#070d1e'); g.addColorStop(1,'#0b1230');
    ctx.fillStyle=g; ctx.fillRect(0,0,VW.w,VW.h);
    // 星星（屏幕空间，密度恒定）
    for(const s of stars){
      ctx.globalAlpha=s.a;
      ctx.fillStyle=s.c;
      ctx.fillRect(s.x,s.y,s.size,s.size);
    }
    ctx.globalAlpha=1;
    // 游戏世界（按 S 缩放，手机上不局促、大屏上不小气）
    ctx.save();
    ctx.scale(S,S);
    if(shakeT>0&&!RM){
      const m=shakeMag*(shakeT/0.2);
      ctx.translate(rand(-m,m),rand(-m,m));
    }
    drawPowerups();
    if(boss) drawBoss(boss);
    for(const e of enemies) drawEnemy(e);
    if(player) drawPlayer();
    drawBullets();
    drawParticles();
    drawTexts();
    if(boss&&bossActive) drawBossBar(boss);
    ctx.restore();
    if(vignette) ctx.drawImage(vignette,0,0,VW.w,VW.h);
    if(flash>0){
      ctx.fillStyle='rgba(255,255,255,'+(flash*0.55)+')';
      ctx.fillRect(0,0,VW.w,VW.h);
    }
  }
  function drawPlayer(){
    const p=player;
    if(p.inv>0&&state!=='menu'&&Math.floor(p.inv*12)%2===0) return;
    ctx.save();
    ctx.translate(p.x,p.y);
    // 引擎火焰
    const fl=0.6+Math.random()*0.5;
    ctx.fillStyle='rgba(255,178,77,'+fl+')';
    ctx.beginPath();
    ctx.moveTo(-5,20); ctx.lineTo(0,20+16*fl); ctx.lineTo(5,20);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle='rgba(255,240,200,'+fl+')';
    ctx.beginPath();
    ctx.moveTo(-2.5,20); ctx.lineTo(0,20+9*fl); ctx.lineTo(2.5,20);
    ctx.closePath(); ctx.fill();
    // 柔和光晕（分层半透明绘制，兼容性最稳，不依赖 shadowBlur/渐变）
    ctx.globalAlpha=0.16; ctx.fillStyle='#4de8ff';
    ctx.beginPath();
    ctx.moveTo(0,-34); ctx.lineTo(21,13); ctx.lineTo(12,16); ctx.lineTo(0,25); ctx.lineTo(-12,16); ctx.lineTo(-21,13);
    ctx.closePath(); ctx.fill();
    ctx.globalAlpha=1;
    // 机身（纯色填充，任何 WebView 都能正常绘制）
    ctx.fillStyle='#7fd8ff';
    ctx.beginPath();
    ctx.moveTo(0,-26);
    ctx.lineTo(5.5,-8); ctx.lineTo(15,6); ctx.lineTo(9,10); ctx.lineTo(4,5);
    ctx.lineTo(0,20);
    ctx.lineTo(-4,5); ctx.lineTo(-9,10); ctx.lineTo(-15,6); ctx.lineTo(-5.5,-8);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.9)'; ctx.lineWidth=1.2;
    ctx.stroke();
    // 翼灯
    ctx.fillStyle='#ff5d8f'; ctx.fillRect(-15,4,4,3);
    ctx.fillStyle='#5dffb0'; ctx.fillRect(11,4,4,3);
    // 座舱
    ctx.fillStyle='rgba(13,48,94,0.95)';
    ctx.beginPath(); ctx.arc(0,-9,3,0,TAU); ctx.fill();
    ctx.restore();
    if(p.shield>0){
      ctx.save();
      ctx.translate(p.x,p.y);
      const layers=Math.min(p.shield,6);
      for(let i=0;i<layers;i++){
        const r=26+i*3;
        ctx.strokeStyle='rgba(127,255,158,'+(0.9-i*0.12)+')'; ctx.lineWidth=2;
        ctx.beginPath(); ctx.arc(0,0,r,0,TAU); ctx.stroke();
        if(i===0){ ctx.strokeStyle='rgba(127,255,158,0.28)'; ctx.lineWidth=5; ctx.beginPath(); ctx.arc(0,0,r,0,TAU); ctx.stroke(); }
      }
      if(p.shield>6){
        ctx.fillStyle='rgba(210,255,225,0.95)'; ctx.font='bold 12px system-ui,sans-serif';
        ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText('x'+p.shield,0,-48);
      }
      ctx.restore();
    }
  }
  function drawEnemy(e){
    const T=ETYPES[e.type];
    ctx.save();
    ctx.translate(e.x,e.y);
    if(e.type==='kamikaze') ctx.rotate(e.ang||0);
    const col=e.hitT>0?'#ffffff':T.color;
    ctx.fillStyle=col;
    ctx.strokeStyle=col;
    ctx.lineWidth=1.5;
    if(e.type==='drone'){
      ctx.globalAlpha=0.92;
      ctx.beginPath();
      ctx.moveTo(0,10); ctx.lineTo(10,-6); ctx.lineTo(4,-9); ctx.lineTo(0,-4); ctx.lineTo(-4,-9); ctx.lineTo(-10,-6);
      ctx.closePath(); ctx.fill();
      ctx.globalAlpha=1;
    } else if(e.type==='fighter'){
      ctx.beginPath();
      ctx.moveTo(0,12); ctx.lineTo(6,-2); ctx.lineTo(16,-8); ctx.lineTo(12,-10); ctx.lineTo(4,-4); ctx.lineTo(0,0);
      ctx.lineTo(-4,-4); ctx.lineTo(-12,-10); ctx.lineTo(-16,-8); ctx.lineTo(-6,-2);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle='rgba(0,0,0,0.35)';
      ctx.beginPath(); ctx.arc(0,-2,3,0,TAU); ctx.fill();
    } else if(e.type==='tank'){
      ctx.fillRect(-16,-14,32,24);
      ctx.fillStyle='rgba(0,0,0,0.3)';
      ctx.fillRect(-16,-14,32,8);
      ctx.fillStyle=col;
      ctx.beginPath(); ctx.arc(0,-6,7,0,TAU); ctx.fill();
      ctx.fillStyle='rgba(0,0,0,0.4)';
      ctx.beginPath(); ctx.arc(0,-6,4,0,TAU); ctx.fill();
      ctx.fillStyle=col;
      ctx.fillRect(-3,10,6,8);
    } else if(e.type==='kamikaze'){
      ctx.beginPath();
      ctx.moveTo(0,12); ctx.lineTo(9,-10); ctx.lineTo(4,-4); ctx.lineTo(0,-8); ctx.lineTo(-4,-4); ctx.lineTo(-9,-10);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }
  function drawBoss(b){
    ctx.save();
    ctx.translate(b.x,b.y);
    // 外层光晕（半透明叠层）
    ctx.globalAlpha=0.14; ctx.fillStyle='#ff4d8d';
    ctx.beginPath();
    ctx.moveTo(0,-b.r-10);
    ctx.lineTo(b.r*0.7,-b.r*0.55); ctx.lineTo(b.r*1.08,-b.r*0.05);
    ctx.lineTo(b.r*0.55,b.r*0.45); ctx.lineTo(0,b.r*1.0);
    ctx.lineTo(-b.r*0.55,b.r*0.45); ctx.lineTo(-b.r*1.08,-b.r*0.05);
    ctx.lineTo(-b.r*0.7,-b.r*0.55);
    ctx.closePath(); ctx.fill();
    ctx.globalAlpha=1;
    // 主体（纯色）
    ctx.fillStyle='#4a1030';
    ctx.beginPath();
    ctx.moveTo(0,-b.r);
    ctx.lineTo(b.r*0.6,-b.r*0.55); ctx.lineTo(b.r*0.95,-b.r*0.1);
    ctx.lineTo(b.r*0.5,b.r*0.4); ctx.lineTo(0,b.r*0.9);
    ctx.lineTo(-b.r*0.5,b.r*0.4); ctx.lineTo(-b.r*0.95,-b.r*0.1);
    ctx.lineTo(-b.r*0.6,-b.r*0.55);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.25)'; ctx.lineWidth=2;
    ctx.stroke();
    // 装甲线
    ctx.strokeStyle='rgba(255,255,255,0.18)'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(-b.r*0.8,-b.r*0.15); ctx.lineTo(b.r*0.8,-b.r*0.15); ctx.stroke();
    // 核心（带叠层光晕）
    ctx.fillStyle='rgba(255,77,141,0.3)';
    ctx.beginPath(); ctx.arc(0,0,b.r*0.42,0,TAU); ctx.fill();
    ctx.fillStyle=b.hitT>0?'#ffffff':'#ff4d8d';
    ctx.beginPath(); ctx.arc(0,0,b.r*0.28,0,TAU); ctx.fill();
    ctx.fillStyle='rgba(0,0,0,0.35)';
    ctx.beginPath(); ctx.arc(0,0,b.r*0.14,0,TAU); ctx.fill();
    ctx.fillStyle='#8f2a4e';
    ctx.fillRect(-b.r-16,-8,26,14);
    ctx.fillRect(b.r-10,-8,26,14);
    ctx.restore();
  }
  function drawBossBar(b){
    const w=Math.min(440,GW*0.66), h=8, x=(GW-w)/2, y=52;
    ctx.fillStyle='rgba(255,255,255,0.12)'; ctx.fillRect(x,y,w,h);
    const p=clamp(b.hp/b.maxHP,0,1);
    ctx.fillStyle=p>0.5?'#ff6b8a':'#ffd24d';
    ctx.fillRect(x,y,w*p,h);
    ctx.fillStyle='rgba(255,255,255,0.06)'; ctx.fillRect(x,y-16,w,12);
    ctx.fillStyle='#ff9db8';
    ctx.font='700 12px sans-serif';
    ctx.textAlign='center';
    ctx.fillText('BOSS',GW/2,y-20);
    ctx.textAlign='left';
  }
  function drawBullets(){
    for(const b of bullets){
      ctx.save();
      ctx.translate(b.x,b.y);
      ctx.rotate(Math.atan2(b.vy,b.vx)+Math.PI/2);
      ctx.fillStyle='rgba(77,232,255,0.3)';
      ctx.fillRect(-2.6,-8,5.2,16);
      ctx.fillStyle='#eafcff';
      ctx.fillRect(-1.1,-8,2.2,16);
      ctx.restore();
    }
    for(const b of ebullets){
      ctx.save();
      ctx.translate(b.x,b.y);
      ctx.fillStyle='rgba(255,107,138,0.3)';
      ctx.beginPath(); ctx.arc(0,0,b.r+2.5,0,TAU); ctx.fill();
      ctx.fillStyle='#ffd7e0';
      ctx.beginPath(); ctx.arc(0,0,b.r,0,TAU); ctx.fill();
      ctx.fillStyle='#ff4d6d';
      ctx.beginPath(); ctx.arc(0,0,b.r*0.55,0,TAU); ctx.fill();
      ctx.restore();
    }
  }
  function drawPowerups(){
    for(const u of powerups){
      const blink=u.life<3&&Math.floor(u.life*6)%2===0;
      ctx.save();
      ctx.translate(u.x,u.y);
      ctx.globalAlpha=blink?0.3:1;
      const col=PU_COL[u.type];
      // 光晕：宽半透明描边 + 亮描边叠层
      ctx.strokeStyle=col; ctx.globalAlpha=0.28*(blink?0.3:1); ctx.lineWidth=7;
      rr(-13,-9,26,18,6); ctx.stroke();
      ctx.globalAlpha=blink?0.3:1;
      ctx.strokeStyle=col; ctx.lineWidth=2;
      ctx.fillStyle='rgba(10,20,40,0.85)';
      rr(-13,-9,26,18,6); ctx.fill(); ctx.stroke();
      ctx.strokeStyle=col; ctx.fillStyle=col;
      ctx.lineWidth=1.8;
      if(u.type==='weapon'){
        ctx.beginPath(); ctx.moveTo(-5,5); ctx.lineTo(0,-3); ctx.lineTo(5,5); ctx.stroke();
      } else if(u.type==='shield'){
        ctx.beginPath();
        ctx.moveTo(0,-5); ctx.lineTo(6,-2); ctx.lineTo(6,1); ctx.quadraticCurveTo(6,4,0,6);
        ctx.quadraticCurveTo(-6,4,-6,1); ctx.lineTo(-6,-2);
        ctx.closePath(); ctx.stroke();
      } else if(u.type==='bomb'){
        ctx.beginPath(); ctx.arc(0,0,4,0,TAU); ctx.fill();
        ctx.strokeStyle=col; ctx.lineWidth=1.5;
        ctx.beginPath(); ctx.moveTo(4,-4); ctx.lineTo(7,-7); ctx.stroke();
      } else if(u.type==='life'){
        ctx.beginPath();
        ctx.moveTo(0,4);
        ctx.bezierCurveTo(-7,-2,-6,-8,-1,-5);
        ctx.bezierCurveTo(6,-8,7,-2,0,4);
        ctx.closePath(); ctx.fill();
      } else {
        ctx.beginPath();
        for(let i=0;i<10;i++){
          const a=i*Math.PI/5-Math.PI/2, rad=i%2===0?5.5:2.2;
          const px=Math.cos(a)*rad, py=Math.sin(a)*rad;
          if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
        }
        ctx.closePath(); ctx.fill();
      }
      ctx.restore();
    }
  }
  function drawParticles(){
    for(const p of parts){
      const a=clamp(p.life/p.max,0,1);
      if(p.kind==='spark'){
        ctx.globalAlpha=a;
        ctx.fillStyle=p.color;
        ctx.fillRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size);
      } else if(p.kind==='ring'||p.kind==='shock'){
        const r=(1-a)*p.maxR;
        ctx.globalAlpha=a*(p.kind==='shock'?0.8:1);
        ctx.strokeStyle=p.color;
        ctx.lineWidth=(p.kind==='shock'?6*a+1:3*a+1);
        ctx.beginPath(); ctx.arc(p.x,p.y,r,0,TAU); ctx.stroke();
      }
    }
    ctx.globalAlpha=1;
  }
  function drawTexts(){
    for(const t of texts){
      ctx.globalAlpha=clamp(t.life/t.max,0,1);
      ctx.fillStyle=t.color;
      ctx.font='800 '+t.size+'px sans-serif';
      ctx.textAlign='center';
      ctx.fillText(t.str,t.x,t.y);
    }
    ctx.globalAlpha=1;
    ctx.textAlign='left';
  }

  // ==================== 界面 ====================
  function updateIcons(){
    if(!player) return;
    // 生命/炸弹统一为「单个图标 + xN」形式，避免图标堆叠
    livesRow.innerHTML=ICON_SHIP+'<span class="xMore">x'+player.lives+'</span>';
    bombsRow.innerHTML=ICON_BOMB+'<span class="xMore xMoreBomb">x'+player.bombs+'</span>';
    bombBtn.querySelector('.cnt').textContent=player.bombs;
    bombBtn.classList.toggle('empty',player.bombs<=0);
  }
  function updateMuteIcon(){
    muteBtn.innerHTML=AUD.muted?ICON_SOUND_OFF:ICON_SOUND_ON;
    muteBtn.setAttribute('aria-checked',String(!AUD.muted));
    muteBtn.style.opacity=AUD.muted?'0.55':'1';
  }
  function showBanner(txt){
    bannerTxt.textContent=txt;
    banner.classList.remove('show');
    void banner.offsetWidth;
    banner.classList.add('show');
  }
  function showMenu(){
    state='menu';
    menuOverlay.classList.remove('hidden');
    pauseOverlay.classList.add('hidden');
    overOverlay.classList.add('hidden');
    bombBtn.classList.add('hidden');
    menuBest.textContent='最高分 '+best;
  }
  function startGame(){
    AUD.ensure();
    player=makePlayer();
    score=0; combo=0; comboT=0; comboMul=1;
    level=1; kills=0; quota=18; bossActive=false; boss=null; spawnT=1.0; time=0; flash=0; shakeT=0; shakeMag=0;
    bullets=[]; ebullets=[]; enemies=[]; powerups=[]; parts=[]; texts=[];
    state='playing';
    menuOverlay.classList.add('hidden');
    pauseOverlay.classList.add('hidden');
    overOverlay.classList.add('hidden');
    bombBtn.classList.remove('hidden');
    updateIcons();
    showBanner('LEVEL 1');
  }
  function pauseGame(){
    if(state!=='playing') return;
    state='paused';
    pauseOverlay.classList.remove('hidden');
  }
  function resumeGame(){
    if(state!=='paused') return;
    state='playing';
    pauseOverlay.classList.add('hidden');
    last=performance.now();
  }
  function gameOver(){
    const oldBest=best;
    if(score>best){ best=score; localStorage.setItem('ps-best',best); }
    state='over';
    finalScore.textContent='本局得分 '+score;
    overBest.textContent=(score>oldBest&&score>0)?'新纪录！最高分 '+best:'最高分 '+best;
    overOverlay.classList.remove('hidden');
    bombBtn.classList.add('hidden');
    AUD.gameover();
  }

  // ==================== 输入绑定 ====================
  function posFromEvent(ev){
    const r=canvas.getBoundingClientRect();
    return {x:ev.clientX-r.left,y:ev.clientY-r.top};
  }
  canvas.addEventListener('pointerdown',ev=>{
    ev.preventDefault();
    AUD.ensure();
    const p=posFromEvent(ev);
    pointer.touch=ev.pointerType!=='mouse';
    pointer.active=true;
    pointer.x=p.x;
    pointer.y=p.y-(pointer.touch?70:0);
    try{ canvas.setPointerCapture(ev.pointerId); }catch(e){}
  });
  canvas.addEventListener('pointermove',ev=>{
    const p=posFromEvent(ev);
    if(ev.pointerType==='mouse') pointer.active=true;
    pointer.x=p.x;
    pointer.y=p.y-(pointer.touch?70:0);
  });
  window.addEventListener('pointerup',()=>{ if(pointer.touch) pointer.active=false; });
  window.addEventListener('pointercancel',()=>{ if(pointer.touch) pointer.active=false; });
  window.addEventListener('keydown',ev=>{
    const c=ev.code;
    if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(c)) ev.preventDefault();
    keys.add(c);
    if((c==='Space'||c==='KeyB'||c==='ShiftLeft'||c==='ShiftRight')&&state==='playing'){ ev.preventDefault(); useBomb(); }
    if(c==='Escape'||c==='KeyP'){
      if(state==='playing') pauseGame();
      else if(state==='paused') resumeGame();
    }
  });
  window.addEventListener('keyup',ev=>keys.delete(ev.code));
  window.addEventListener('blur',()=>{ if(state==='playing') pauseGame(); });
  document.addEventListener('visibilitychange',()=>{ if(document.hidden&&state==='playing') pauseGame(); });
  canvas.addEventListener('contextmenu',ev=>ev.preventDefault());
  $('startBtn').addEventListener('click',startGame);
  $('againBtn').addEventListener('click',startGame);
  $('resumeBtn').addEventListener('click',resumeGame);
  $('restartBtn').addEventListener('click',startGame);
  bombBtn.addEventListener('click',()=>useBomb());
  muteBtn.addEventListener('click',()=>{
    AUD.muted=!AUD.muted;
    localStorage.setItem('ps-muted',AUD.muted?'1':'0');
    updateMuteIcon();
  });

  // ==================== 视口适配 ====================
  function resize(){
    VW.w=window.innerWidth; VW.h=window.innerHeight;
    VW.dpr=Math.min(2,window.devicePixelRatio||1);
    canvas.width=Math.round(VW.w*VW.dpr);
    canvas.height=Math.round(VW.h*VW.dpr);
    // 关键：显式固定画布元素显示尺寸 = 视口大小。
    // 否则高 DPR 设备上画布会按位图尺寸撑开，只显示左上角一小块，战机等下半屏内容全部在屏幕外
    canvas.style.width=VW.w+'px';
    canvas.style.height=VW.h+'px';
    S=clamp(Math.min(VW.w,VW.h)/BASE,0.82,2.0);
    if(!isFinite(S)||S<=0) S=1;
    GW=VW.w/S; GH=VW.h/S;
    makeStars();
    makeVignette();
    if(player){
      player.x=clamp(player.x,22,GW-22);
      player.y=clamp(player.y,60,GH-150);
    }
    if(boss) boss.x=clamp(boss.x,90,GW-90);
  }
  let rzT=0;
  function requestResize(){
    if(rzT) return;
    rzT=requestAnimationFrame(()=>{ rzT=0; resize(); });
  }
  window.addEventListener('resize',requestResize);
  window.addEventListener('orientationchange',()=>setTimeout(resize,150));
  if(window.visualViewport) window.visualViewport.addEventListener('resize',requestResize);
  window.addEventListener('load',requestResize);
  setTimeout(resize,400);   // 兜底：个别 WebView 首帧尺寸异常时自动校正

  // ==================== 主循环 ====================
  let last=performance.now();
  function loop(now){
    let dt=(now-last)/1000;
    last=now;
    dt=Math.min(0.033,dt);
    // try/catch 兜底：个别设备上即使某一帧出异常，游戏也不会整体卡死
    try{
      if(state==='playing'){
        update(dt);
      } else if(state==='menu'||state==='over'){
        updateStars(dt);
        updateParticles(dt);
        updateTexts(dt);
        shakeT=Math.max(0,shakeT-dt);
        flash=Math.max(0,flash-dt*2.4);
      }
      render();
    }catch(err){
      console.error('loop error',err);
    }
    requestAnimationFrame(loop);
  }

  // ==================== 启动 ====================
  resize();
  updateMuteIcon();
  menuBest.textContent='最高分 '+best;
  requestAnimationFrame(loop);
})();
</script>
</body>
